# C6 modules that answer UDS on native ISO-TP ids (not TP 2.0). From Bear's
# own captures: the airbag at 0x715/0x77F (VCDS-Autoscan.log, the only module
# the C6 gateway routes as UDS in that scan).
kind: addressing
modules:
  - addr: "15"
    name: Airbags (UDS)
    kline: { address: 0x15, init: slow }
    isotp: { request: 0x715, response: 0x77F, functional: 0x7DF }
    generations: [C6]
    source: capture
    note: "C6 airbag 4F0910655x answers UDS 22 F1 xx on 0x715<-0x77F (Reference/Logs/VCDS-Autoscan.log); response = request + 0x6A."
