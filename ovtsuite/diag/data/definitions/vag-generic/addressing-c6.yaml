# Audi A6 / S6 (4F, C6) module address table as the car's own gateway holds
# it: every row below is one record of the gateway's installation list
# (``22 04 A1`` -> ``<addr> <TP 2.0 dest> <status> <bus>``), read from Bear's
# A6 C6 in his own sniffer capture of a workshop-tool autoscan
# (Reference/Logs/VCDS-Autoscan.log, 2026-09-20). The TP 2.0 dest is therefore
# a fact of this platform's gateway, whether or not that module was fitted to
# that car; "bus" is the list's bus byte (00 drive CAN, 01 comfort CAN, 04
# infotainment, 03 the instruments' own, 0D the gateway itself) as a word
# where the grouping of known modules makes it plain, else as the number.
# Three of these dests were already known from the bench (01, 02, 03) and two
# from earlier captures (08 -> 0x2C, 17 -> 0x07); the capture agrees with all
# five. The K-line convention rows live in addressing.yaml; the generation
# descriptions too.
kind: addressing
modules:
  - addr: "19"
    name: CAN gateway
    tp20: { dest: 0x1F }
    bus: gateway
    gateway: { installation_list: did_04a1 }
    generations: [C6]
    source: capture
